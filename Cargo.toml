[package]
name = "wsforge"
version = "0.1.0"
edition = "2021"
description = "Comprehensive WebSocket CLI and protocol analyzer"
license = "MIT"
authors = ["Edgar Ortega Ramirez"]
repository = "https://github.com/EdgarOrtegaRamirez/wsforge"
readme = "README.md"
default-run = "wsforge"

[[bin]]
name = "wsforge"
path = "src/main.rs"

[[example]]
name = "connect"
path = "examples/connect.rs"

[[example]]
name = "replay"
path = "examples/replay.rs"

[[example]]
name = "validate"
path = "examples/validate.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
url = "2"
log = "0.4"
env_logger = "0.11"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
